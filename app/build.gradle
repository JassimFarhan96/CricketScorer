// app/build.gradle
// Cricket Scorer — app-level Gradle build file

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cricket.scorer'
    compileSdk 34

    defaultConfig {
        applicationId "com.cricket.scorer"
        minSdk 24              // Android 7.0 — covers ~95% of devices
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // poi-android bundles xmlbeans, xerces, etc. Some of those JARs contain
    // duplicate META-INF entries that AAPT2 complains about. Skip them at
    // packaging time so the APK builds cleanly.
    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module',
                'META-INF/INDEX.LIST'
            ]
        }
    }
}

dependencies {
    // Core Android
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // RecyclerView (ball list + over history)
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // CardView (menu cards, stats cards, break card)
    implementation 'androidx.cardview:cardview:1.0.0'

    // FlexboxLayout (wrapping ball input buttons in InningsActivity)
    // Used for the row of Dot / 1 / 2 / 3 / 4 / 6 / Wide / No Ball / Wicket / Undo
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    // ─── poi-android — Apache POI 3.17 transpiled for Android ──────────────
    //
    // Pulled from JitPack (repo declared in settings.gradle). This is a fork
    // of Apache POI 3.17 that strips out java.awt and java.lang.invoke.MethodHandle
    // references that break Android dexing for API < 26. Used by
    // MatchExcelExporter for true XLSX output with EMBEDDED chart images
    // (drawing.createPicture).
    //
    // Adds ~10MB to the APK. The ":proguard" sibling artifact ships
    // pre-configured -keep rules; our own proguard-rules.pro layers on top.
    implementation 'com.github.SUPERCILEX.poi-android:poi:3.17'
    implementation 'com.github.SUPERCILEX.poi-android:proguard:3.17'
    // Aalto-XML — a fast StAX parser that works on Android.
    // poi-android's shim redirects its javax.xml.stream calls here via the
    // three System.setProperty calls in CricketApp.onCreate(). Without this
    // dep, POI tries to load com.bea.xml.stream.EventFactory which doesn't
    // exist on Android and throws FactoryConfigurationError at runtime.
    //implementation 'com.fasterxml:aalto-xml:1.3.2'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
